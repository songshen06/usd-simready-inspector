  default_prompt: "Use $usd-simready-cli for SimReady recommendation, mesh-gated process/apply, dependency packaging, scale/orientation correction, static collision authoring, safe RB.COL.002 candidate repair, and report verification. For RB.COL.002, accept only primitive_collider_audit.json from omni-asset-cli physics-collider-audit, export a separate candidate through collider-repair, and preserve CollisionAPI, geometry, transforms, rigid bodies, and joints; then ask omni-asset-cli to re-audit. Foundation-profile-dependent work uses the separately deployed pinned Foundation checkout, but this skill never executes or passes a Foundation profile: omni-asset-cli owns Prop-Robotics-Physx shadow validation, provenance, PhysX views, and Docker contact acceptance. Keep upstream approximation conformance, local RB.COL.003 convex-cooking risk, and runtime air-wall evidence separate. Let process call the validator preflight before authoring; for standalone validator explanation, Isaac Sim runtime, or simready-flywheel reports, use $omniverse-usd-asset-validator. If downstream runtime output disagrees on size, verify the exported USD directly before blaming the upstream asset."
